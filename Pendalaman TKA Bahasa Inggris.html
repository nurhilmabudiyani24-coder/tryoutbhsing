{n:"Text 1 · The Elephant and the Little Bird",b:"Once upon a time, in a green forest, there lived a big elephant named Gaja. Every morning, he walked to the lake to drink water and take a bath.¶One morning, a little bird named Kiki was singing happily on a branch above the lake. Gaja was tired and wanted to rest, but Kiki's song was loud. He became angry and shook the tree. Kiki's nest fell into the water.¶\"Please forgive me!\" cried Kiki. \"I only wanted to sing. If you forgive me, I promise I will help you one day.\"¶Gaja laughed. \"A tiny bird cannot help a big elephant.\" But he felt sorry for her, so he lifted the nest out of the water with his trunk and put it back on the branch.¶A few weeks later, Gaja was walking near the hills when he fell into a deep, muddy hole. He pulled and pushed, but the mud was too thick. He trumpeted loudly, but nobody heard him.¶Kiki heard the sound and flew over. She saw Gaja stuck in the mud. \"Don't worry, I will find help!\" she said. She flew quickly to the herd and sang loudly until the other elephants followed her. Together, they pulled Gaja out of the hole with their trunks.¶Gaja looked at Kiki and said, \"Thank you. I was wrong to laugh at you.\" Kiki smiled. From that day, the elephant and the little bird became good friends. Gaja learned that no one is too small to help, and that kindness always comes back."},
{n:"Text 2 · Easy Ways to Stay Healthy at School",b:"<b>1. Wash Your Hands:</b> Use soap before eating and after using the toilet.¶<b>2. Drink Enough Water:</b> Bring a water bottle and drink 6–8 glasses a day.¶<b>3. Eat Balanced Meals:</b> Include fruit, vegetables, and protein in your meals.¶<b>4. Move Your Body:</b> Exercise for at least 30 minutes every day.¶<b>5. Sleep Well:</b> Aim for 8–9 hours of sleep every night.¶<b>6. Keep Your Bag Light:</b> Carry only the books you need to protect your back.¶<b>7. Sit Straight:</b> Keep a good posture when you study.¶<b>8. Take Screen Breaks:</b> Rest your eyes for a few minutes every 20 minutes.¶<b>9. Talk to Someone:</b> Share your feelings with friends, family, or teachers.¶<b>10. Stay Home When Sick:</b> Rest well and avoid spreading germs to others."},

{n:"Text 4 · Mount Bromo",b:"Mount Bromo is one of the most famous volcanoes in Indonesia. It is located in East Java, in the Bromo Tengger Semeru National Park. The mountain is about 2,329 meters high and is still active.¶Around the volcano, there is a wide area of gray sand called the Sea of Sand. In the early morning, visitors drive jeeps or ride horses across it. Many tourists also climb Mount Penanjakan to watch the sunrise. When the sun rises, the sky turns orange, pink, and gold. Thin white clouds lie over the valley like a soft blanket.¶The Tengger people live around the mountain. They believe that the volcano is sacred, and every year they hold the Yadnya Kasada ceremony. During the ceremony, they throw fruits, vegetables, and flowers into the crater as offerings.¶The cool air and beautiful views make Bromo a special place to visit. However, visitors must always respect nature and the local culture."},
{n:"Text 5 · Why Students Should Read Books Every Day",b:"Many students today spend their free time on phones and games. However, reading books every day is a habit that brings many benefits. Students who read regularly can do better at school and in life.¶First, reading improves vocabulary and language skills. When students read, they learn new words and see how sentences are built. This helps them write and speak more clearly.¶Second, reading helps students focus. Unlike short videos, a book needs students to pay attention for a longer time. Over time, they can concentrate better when studying.¶Third, reading reduces stress. Reading quietly for fifteen to twenty minutes before bed can help students relax and sleep better.¶Finally, reading gives students knowledge about the world, from history to science, which makes class discussions easier.¶In conclusion, students should read books every day because it builds language skills, improves focus, lowers stress, and expands knowledge. Schools and families should support this habit.¶<b>Table 1. How do students read?</b><div class='tw'><table><tr><th>Category</th><th>%</th><th>Notes</th></tr><tr><td>Read books daily</td><td>30%</td><td>At least 15 minutes a day</td></tr><tr><td>Read only for school assignments</td><td>40%</td><td>Rarely read for fun</td></tr><tr><td>Own a library card</td><td>20%</td><td>Can borrow books for free</td></tr><tr><td>Read before bed</td><td>25%</td><td>Often report better sleep</td></tr><tr><td>Spend most free time on phones</td><td>55%</td><td>Mainly social media and games</td></tr><tr><td>Read in two languages</td><td>15%</td><td>Often have a wider vocabulary</td></tr></table></div>"}

<div class="card"><h3>📈 Riwayat & Progres</h3>${h.length?progress(h,1)+`<p><button class="btn o" onclick="cert(${h.length-1})">Lihat sertifikat terakhir</button></p>`:'<p style="color:var(--mu)">Belum ada riwayat. Kerjakan Try Out untuk melihat progres.</p>'}</div>`}

function progress(h,to){const r=h.map((x,i)=>({...x,i})).filter(x=>x.to==to);if(!r.length)return"";
return`<div class="tw"><table><tr><th>#</th><th>Tanggal</th><th>Nama</th><th>Nilai</th><th style="min-width:120px">Progres</th><th></th></tr>${r.map((x,n)=>`<tr><td>${n+1}</td><td>${x.date}</td><td>${esc(x.name)}</td><td><b>${x.score}</b>${n?` <small style="color:${x.score>=r[n-1].score?"var(--ok)":"#e11d48"}">${x.score>=r[n-1].score?"▲":"▼"}${Math.abs(x.score-r[n-1].score)}</small>`:""}</td><td><div class="pb"><div style="width:${x.score}%"></div></div></td><td><button class="btn o" onclick="cert(${x.i})">Sertifikat</button></td></tr>`).join("")}</table></div>`}

function form(){A.innerHTML=`<div class="card" style="max-width:520px;margin:auto"><h2>Data Peserta</h2>
<label>Nama Siswa</label><input id="f1"><label>Kelas</label><input id="f2" placeholder="mis. XII IPA 1"><label>Peserta Didik (NISN / No. Peserta)</label><input id="f3"><label>Asal Sekolah</label><input id="f4" value="SMAN 2 Kalianda">
<p style="font-size:13px;color:var(--mu)">Waktu ${DUR/60} menit. Soal akan dikumpulkan otomatis saat waktu habis.</p>
<div class="bar"><button class="btn o" onclick="home()">Kembali</button><button class="btn" onclick="start()">Mulai Mengerjakan</button></div></div>`}

function start(){const u={name:$("f1").value.trim(),kls:$("f2").value.trim(),pid:$("f3").value.trim(),sch:$("f4").value.trim()};
if(!u.name||!u.kls||!u.sch){alert("Lengkapi nama, kelas, dan asal sekolah.");return}
S={u,ans:Array(N).fill(null),db:Array(N).fill(false),i:0,left:DUR,tm:null};
S.tm=setInterval(()=>{S.left--;tick();if(S.left<=0){clearInterval(S.tm);finish(true)}},1000);quiz()}

const fmt=s=>String(Math.floor(s/3600)).padStart(2,"0")+":"+String(Math.floor(s%3600/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function tick(){const e=$("tm");if(e){e.textContent=fmt(S.left);e.className="timer"+(S.left<300?" low":"")}}

function quiz(){const q=Q[S.i],t=T[q.x],a=S.ans[S.i];let body="";
if(q.t=="tb"){body=`<div class="tw"><table><tr><th></th>${q.c.map(c=>`<th>${c}</th>`).join("")}</tr>${q.o.map((o,r)=>`<tr><td>${o}</td>${q.c.map((c,j)=>`<td class="c"><input type="radio" style="width:auto" name="r${r}" ${a&&a[r]===j?"checked":""} onclick="pickT(${r},${j})"></td>`).join("")}</tr>`).join("")}</table></div>`}
else body=q.o.map((o,j)=>{const s=q.t=="mc"?a===j:a&&a.includes(j);return`<div class="opt ${s?"s":""}" onclick="pick(${j})"><b>${q.t=="mc"?L(65+j)+".":s?"☑":"☐"}</b><span>${esc(o)}</span></div>`}).join("");
const last=S.i==N-1;
A.innerHTML=`<div class="quiz"><div>
<div class="card"><h3 style="color:var(--pr)">${t.n}</h3><div class="pass">${t.b.split("¶").map(p=>`<p>${p}</p>`).join("")}</div></div>
<div class="card"><b>Soal ${S.i+1} dari ${N}</b>${S.db[S.i]?' <span class="pill" style="background:var(--db);color:#222">Ragu-ragu</span>':""}<p style="font-weight:600">${esc(q.p)}</p>${body}
<div class="bar"><button class="btn o" ${S.i?"":"disabled"} onclick="go(${S.i-1})">◀ Sebelumnya</button><button class="btn g" onclick="doubt()">${S.db[S.i]?"✔ Batal ragu":"❓ Ragu-ragu"}</button>${last?`<button class="btn r" onclick="confirmEnd()">Selesai ✔</button>`:`<button class="btn" onclick="go(${S.i+1})">Selanjutnya ▶</button>`}</div></div></div>
<div class="card side"><div class="timer" id="tm">${fmt(S.left)}</div><p style="text-align:center;margin:0 0 10px;font-size:12px;color:var(--mu)">Sisa waktu</p>
<div class="nav">${Q.map((_,i)=>`<button class="nb ${S.db[i]?"d":isA(i)?"a":""} ${i==S.i?"cur":""}" onclick="go(${i})">${i+1}</button>`).join("")}</div>
<div class="lg"><span><i style="background:var(--ok)"></i>Dijawab</span><span><i style="background:var(--db)"></i>Ragu-ragu</span><span><i style="background:var(--no)"></i>Belum</span></div>
<p style="font-size:13px;color:var(--mu)">${S.u.name} · ${S.u.kls}</p><button class="btn r" style="width:100%" onclick="confirmEnd()">Kumpulkan</button></div></div>`;tick()}

function pick(j){const q=Q[S.i];if(q.t=="mc")S.ans[S.i]=j;else{let a=S.ans[S.i]||[];a=a.includes(j)?a.filter(x=>x!=j):[...a,j];S.ans[S.i]=a}quiz()}
function pickT(r,j){const a=S.ans[S.i]||[];a[r]=j;S.ans[S.i]=a;quiz()}
function go(i){S.i=i;quiz();scrollTo(0,0)}
function doubt(){S.db[S.i]=!S.db[S.i];quiz()}
function confirmEnd(){const b=S.ans.filter((_,i)=>!isA(i)).length,d=S.db.filter(Boolean).length;
if(confirm(`Kumpulkan sekarang?\nBelum dijawab: ${b}\nRagu-ragu: ${d}`))finish(false)}

function finish(auto){clearInterval(S.tm);let b=0,s=0,k=0;const det=T.map(()=>({b:0,n:0}));
Q.forEach((q,i)=>{det[q.x].n++;if(!isA(i))k++;else if(isOk(i)){b++;det[q.x].b++}else s++});
const score=Math.round(b/N*100),h=store.get();
h.push({to:1,...S.u,score,b,s,k,det,date:new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})});store.set(h);S.h=h;S.hi=h.length-1;S.auto=auto;result()}

function result(){const r=S.h[S.hi];
A.innerHTML=`<div class="card" style="text-align:center">${S.auto?"<p><b>⏰ Waktu habis, jawaban dikumpulkan otomatis.</b></p>":""}<h2>Hasil Try Out 1</h2><div class="big">${r.score}</div><p style="color:var(--mu)">Nilai Akhir</p>
<p><b>${esc(r.name)}</b><br>Kelas ${esc(r.kls)}${r.pid?" · Peserta Didik: "+esc(r.pid):""}<br>${esc(r.sch)}</p>
<p>✅ Benar <b>${r.b}</b> · ❌ Salah <b>${r.s}</b> · ⬜ Kosong <b>${r.k}</b></p>
<div class="bar np" style="justify-content:center"><button class="btn" onclick="cert(${S.hi})">🏅 Sertifikat & Progres</button><button class="btn o" onclick="home()">Beranda</button></div></div>
<h2>Pembahasan</h2>${Q.map((q,i)=>{const c=isOk(i),e=!isA(i);return`<div class="card rv ${c?"y":e?"":"n"}"><b>Soal ${i+1}</b> <span class="pill" style="background:${c?"var(--ok)":e?"#64748b":"#e11d48"}">${c?"Benar":e?"Kosong":"Salah"}</span><p style="font-weight:600;margin:8px 0">${esc(q.p)}</p><p style="font-size:14px">Jawabanmu: ${esc(txt(q,S.ans[i]))}<br>Kunci: <b>${esc(key(q))}</b></p><p style="font-size:14px;background:var(--bg);padding:8px 10px;border-radius:8px">💡 ${q.e}</p></div>`}).join("")}`;scrollTo(0,0)}

function cert(i){const h=store.get(),r=h[i];if(!r){home();return}
const pred=r.score>=80?"Sangat Baik":r.score>=60?"Baik":r.score>=40?"Cukup":"Perlu Ditingkatkan";
A.innerHTML=`<div class="cert card"><div style="font-size:40px">🏅</div><h2>SERTIFIKAT HASIL TRY OUT</h2><p>Pendalaman TKA Bahasa Inggris · Try Out ${r.to}</p><p>diberikan kepada</p>
<h3 style="font-size:26px;margin:4px 0">${esc(r.name)}</h3><p>Kelas ${esc(r.kls)}${r.pid?" · Peserta Didik: "+esc(r.pid):""}<br>${esc(r.sch)}</p>
<div class="big">${r.score}</div><p><b>${pred}</b> · ${r.date}</p>
<div class="tw"><table><tr><th>Teks</th><th>Benar</th><th>Jumlah Soal</th><th>Penguasaan</th></tr>${r.det.map((d,j)=>`<tr><td>${T[j].n}</td><td>${d.b}</td><td>${d.n}</td><td><div class="pb"><div style="width:${d.b/d.n*100}%"></div></div></td></tr>`).join("")}</table></div>
<p>Benar ${r.b} · Salah ${r.s} · Kosong ${r.k}</p>
<h3 style="text-align:left">Progres Try Out ${r.to}</h3>${progress(h.filter(x=>x.name==r.name||true),r.to)}
<p style="font-size:13px;color:var(--mu)">Dikembangkan oleh Nur Hilma Budiyani, M.Pd · SMAN 2 Kalianda</p></div>
<div class="bar np" style="justify-content:center"><button class="btn" onclick="print()">🖨 Cetak / Simpan PDF</button><button class="btn o" onclick="home()">Beranda</button></div>`;scrollTo(0,0)}
home();
</script></body></html>
